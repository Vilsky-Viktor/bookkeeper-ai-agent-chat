[tool.poetry]
name = "agent-service"
version = "0.1.0"
description = "Bookkeeping chat — agent service (LangGraph chat agent, owns the chat Postgres DB)"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "==0.115.0"
uvicorn = { version = "==0.30.6", extras = ["standard"] }
asyncpg = "==0.30.0"
httpx = "==0.27.2"
pydantic = "==2.9.2"
firebase-admin = "==6.5.0"
google-cloud-firestore = "==2.18.0"
google-cloud-storage = "==2.18.2"
openai = "==3.17.0"
langgraph = "==1.2.12"
langchain-core = "==1.6.4"
langchain-openai = "==1.6.3"
langchain = "==1.4.2"
langfuse = "==4.15.4"
tiktoken = "==0.14.0"
pymupdf = "==1.28.2"
python-multipart = "==0.0.9"

[tool.poetry.group.dev.dependencies]
black = "==24.10.0"
isort = "==5.13.2"
mypy = "==1.13.0"
poethepoet = ">=0.29,<1.0"
pytest = "==8.3.3"
pytest-asyncio = "==0.24.0"

[tool.poe.tasks]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
lint = "mypy app"
test = "pytest"

# Plain-string tasks run via exec (no shell), so `&&` chains need the explicit shell
# task type instead.
[tool.poe.tasks.format]
shell = "black app tests && isort app tests"

[tool.poe.tasks."format:check"]
shell = "black --check app tests && isort --check app tests"

[tool.poe.tasks.check]
shell = "black --check app tests && isort --check app tests && mypy app && pytest"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"

# These ship no type stubs / py.typed marker — ignoring missing imports only for them
# (not repo-wide) keeps mypy useful for catching real typos on everything else.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "google.cloud", "google.cloud.*", "firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
