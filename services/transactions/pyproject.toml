[tool.poetry]
name = "transactions-service"
version = "0.1.0"
description = "Bookkeeping chat — transactions service (owns the bookkeeping Postgres DB)"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "==0.115.0"
uvicorn = { version = "==0.30.6", extras = ["standard"] }
asyncpg = "==0.30.0"
pydantic = "==2.9.2"
firebase-admin = "==6.5.0"
google-cloud-firestore = "==2.18.0"
openai = "==3.17.0"
python-multipart = "==0.0.9"

[tool.poetry.group.dev.dependencies]
black = "==24.10.0"
isort = "==5.13.2"
mypy = "==1.13.0"
poethepoet = ">=0.29,<1.0"

[tool.poe.tasks]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
lint = "mypy app"

# Plain-string tasks run via exec (no shell), so `&&` chains need the explicit shell
# task type instead.
[tool.poe.tasks.format]
shell = "black app && isort app"

[tool.poe.tasks."format:check"]
shell = "black --check app && isort --check app"

[tool.poe.tasks.check]
shell = "black --check app && isort --check app && mypy app"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"

# These ship no type stubs / py.typed marker — ignoring missing imports only for them
# (not repo-wide) keeps mypy useful for catching real typos on everything else.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "google.cloud", "google.cloud.*", "firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
