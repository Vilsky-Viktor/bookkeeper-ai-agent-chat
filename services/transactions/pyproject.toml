[project]
name = "transactions-service"
version = "0.1.0"
description = "Bookkeeping chat — transactions service (owns the bookkeeping Postgres DB)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "asyncpg==0.30.0",
    "pydantic==2.9.2",
    "firebase-admin==6.5.0",
    "google-cloud-firestore==2.18.0",
    "google-auth==2.58.0",
    "openai==3.17.0",
    "python-multipart==0.0.9",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "mypy==1.13.0",
    "poethepoet>=0.29,<1.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[tool.uv]
package = false

[tool.poe.tasks]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
lint = "mypy app evals"
test = "pytest"

# Plain-string tasks run via exec (no shell), so `&&` chains need the explicit shell
# task type instead.
[tool.poe.tasks.format]
shell = "black app tests evals && isort app tests evals"

[tool.poe.tasks."format:check"]
shell = "black --check app tests evals && isort --check app tests evals"

[tool.poe.tasks.check]
shell = "black --check app tests evals && isort --check app tests evals && mypy app evals && pytest"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"

# These ship no type stubs / py.typed marker — ignoring missing imports only for them
# (not repo-wide) keeps mypy useful for catching real typos on everything else.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "google.cloud", "google.cloud.*", "firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
