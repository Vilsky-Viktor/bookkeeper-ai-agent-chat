services:
  proxy:
    image: caddy:2
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [web, agent, transactions, fake-gcs]

  web:
    build: ./web
    command: pnpm run dev -- --host 0.0.0.0 --port 5173
    volumes: ["./web:/app", "/app/node_modules"]
    environment:
      VITE_RECEIPTS_BUCKET: receipts-local # must match agent's RECEIPTS_BUCKET

  firebase:
    build: ./firebase
    ports: ["9099:9099", "8081:8081", "4000:4000"] # auth, firestore, emulator UI
    # Emulator state survives restarts and recreation (see firebase/Dockerfile's CMD).
    # Delete this folder to start from a clean emulator.
    volumes: ["./firebase/emulator-data:/emulator/state"]
    stop_grace_period: 30s # time to export on shutdown

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bookkeeping
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner_pw
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro # creates bookkeeping + chat DBs
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      # Over TCP on purpose: during first-boot init, Postgres runs on a socket-only
      # temporary server, so a socket check could pass before db/init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U owner -d bookkeeping"]
      interval: 3s
      retries: 20

  # Applies db/migrations to both databases, then exits; the services start after it.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0 # keep in sync with db/Dockerfile
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    volumes: ["./db:/db:ro"]
    environment:
      BOOKKEEPING_DATABASE_URL: postgres://owner:owner_pw@postgres:5432/bookkeeping?sslmode=disable
      CHAT_DATABASE_URL: postgres://owner:owner_pw@postgres:5432/chat?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  fake-gcs:
    image: fsouza/fake-gcs-server
    # On disk (./gcs, one folder per bucket), so receipts survive restarts like the
    # database rows that point at them. The bucket folder is created here: the
    # emulator doesn't create buckets on upload, and a placeholder file inside it
    # would break object listing.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /storage/receipts-local && exec /bin/fake-gcs-server -scheme http -port 4443 -backend filesystem -filesystem-root /storage
    volumes: ["./gcs:/storage"]

  transactions:
    build:
      context: ./services/transactions
      dockerfile: Dockerfile.dev # Dockerfile itself is the Cloud Run production image
    # Source is bind-mounted and uvicorn reloads on change, like web's Vite server —
    # only dependency (pyproject.toml/uv.lock) changes need a rebuild.
    command: ["uv", "run", "poe", "dev"]
    volumes: ["./services/transactions/app:/app/app", "./services/transactions/evals:/app/evals"]
    env_file: .env
    environment:
      # Bytecode lives in the container only: never written into the mounted source,
      # and never read from it (host test runs write __pycache__ there too, and a
      # reload that reads one mid-write crashes on a truncated .pyc).
      PYTHONPYCACHEPREFIX: /tmp/pycache
      DATABASE_URL: postgresql://app_user:app_pw@postgres:5432/bookkeeping
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIRESTORE_EMULATOR_HOST: firebase:8081
      GOOGLE_CLOUD_PROJECT: demo-bookkeeping
      SKIP_SERVICE_AUTH: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      firebase: { condition: service_started }

  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile.dev # Dockerfile itself is the Cloud Run production image
    command: ["uv", "run", "poe", "dev"] # see transactions above
    volumes: ["./services/agent/app:/app/app", "./services/agent/evals:/app/evals"]
    env_file: .env
    environment:
      PYTHONPYCACHEPREFIX: /tmp/pycache # see transactions above
      CHAT_DATABASE_URL: postgresql://chat_user:chat_pw@postgres:5432/chat
      TRANSACTIONS_URL: http://transactions:8000
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIRESTORE_EMULATOR_HOST: firebase:8081
      GOOGLE_CLOUD_PROJECT: demo-bookkeeping
      STORAGE_MODE: local
      TASKS_MODE: local
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      RECEIPTS_BUCKET: receipts-local
      PUBLIC_UPLOAD_BASE: http://localhost:8080/gcs
      SKIP_SERVICE_AUTH: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      transactions: { condition: service_started }
      fake-gcs: { condition: service_started }

volumes:
  pgdata:
