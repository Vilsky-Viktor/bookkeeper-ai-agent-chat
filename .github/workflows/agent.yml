name: agent

# PR -> checks. Push to main -> checks + image (tagged sha-<commit>, not deployed).
# Deploys happen only from a release tag: see release.yml.

on:
  pull_request:
    paths:
      - "services/agent/**"
      - "services/Dockerfile"
      - ".github/workflows/agent.yml"
      - ".github/workflows/python-service.yml"
      # Read by tests/test_contracts.py (lists this service keeps copies of).
      - "services/transactions/app/money.py"
      - "web/src/lib/i18n/languages.ts"
      - "web/src/lib/i18n/locales/en.ts"
  push:
    branches: [main]
    paths:
      - "services/agent/**"
      - "services/Dockerfile"
      - ".github/workflows/agent.yml"
      - ".github/workflows/python-service.yml"
      # Read by tests/test_contracts.py (lists this service keeps copies of).
      - "services/transactions/app/money.py"
      - "web/src/lib/i18n/languages.ts"
      - "web/src/lib/i18n/locales/en.ts"

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no GCP key stored in this repo

jobs:
  ci:
    uses: ./.github/workflows/python-service.yml
    with:
      service: agent
      push_image: ${{ github.event_name == 'push' }}
