name: python-service

# Checks one Python service, then optionally builds and pushes its image
# (services/Dockerfile). Called by agent.yml / transactions.yml (PRs, pushes to main)
# and release.yml (release tags).

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      push_image:
        type: boolean
        default: false
      image_tag:
        description: Defaults to sha-<short commit>.
        type: string
        default: ""
    outputs:
      image:
        description: The pushed image, repository:tag.
        value: ${{ jobs.build-and-push.outputs.image }}

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prod-services/${{ inputs.service }}

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.18" # also services/Dockerfile's UV_VERSION
      - run: uv sync --frozen
      - run: uv run poe check # format:check + lint + test

  build-and-push:
    if: inputs.push_image
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: echo "image=${IMAGE}:${TAG:-sha-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_CD_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          file: services/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
